[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "lyph-api"
version = "0.1.0"
description = "lyph 正式内容、采集与个人 Agent 服务"
license = { text = "MIT" }
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "minio==7.2.20",
  "APScheduler==3.11.3",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "openai==3.24.0",
  "sqlite-vec==0.1.9",
  "langchain-text-splitters==1.1.3",
  "pypdf==6.19.0",
  "python-docx==1.2.0",
  "docker==7.1.0",
  "mcp>=1.26,<2",
  "ag-ui-protocol>=0.1,<1",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
lyph = "lyph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lyph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:langsmith_plugin"

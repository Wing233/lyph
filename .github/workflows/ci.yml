name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LYPH_CHAT_UNLIMITED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: api
        run: uv sync --frozen --extra test
      - name: Test
        working-directory: api
        # All offline tests. The real-MinIO test self-skips unless
        # LYPH_TEST_MINIO_* is configured.
        run: uv run pytest tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LYPH_CHAT_UNLIMITED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Install API fixture deps
        working-directory: api
        run: uv sync --frozen --extra test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Chat-first browser flows
        working-directory: web
        # Chat-first UI replaces the legacy home, so it runs with its own
        # dev-server config and mocked API fixtures.
        run: npx playwright test tests/chat-first.spec.ts --config=playwright.chat.config.ts
      - name: Product browser flows
        working-directory: web
        env:
          LYPH_TEST_PYTHON: ${{ github.workspace }}/api/.venv/bin/python
        # Login/auth, permission revocation, chat settlement/recovery,
        # publish isolation and version rollback against the legacy home.
        run: npx playwright test tests/product.spec.ts

  collectors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test core
        working-directory: collectors
        run: cargo test --locked -p lyph-collector-core

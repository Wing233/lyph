user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream api_backend { zone api_backend 64k; server api-internal:8000 resolve; }
    upstream web_backend { zone web_backend 64k; server web:3000 resolve; }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 21m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_tokens off;
        location /.well-known/acme-challenge/ { root /var/www/acme; }
        location / { return 308 https://$host$request_uri; }
    }
    server {
        listen 8443 ssl;
        ssl_certificate /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_tokens off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 180s;
        }
        location /health { proxy_pass http://api_backend/health; }
        location / { proxy_pass http://web_backend; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
    }
}

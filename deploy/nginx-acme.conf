user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
    access_log off;
    error_log /dev/stderr warn;
    server {
        listen 8080;
        server_tokens off;
        location /.well-known/acme-challenge/ { root /var/www/acme; }
        location / { return 503; }
    }
}

[workspace]
members = ["core", "linux", "windows/src-tauri"]
default-members = ["core", "linux"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
sha2 = "=0.11.0"
tempfile = "=3.27.0"
xcap = "=0.9.8"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
